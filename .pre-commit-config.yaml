repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      # Linter with automatic fixes for readability and simplicity
      - id: ruff-check
        args: [--fix]
      # Deterministic code formatter (eliminates styling debates)
      - id: ruff-format

  - repo: local
    hooks:
      - id: peer-eval-gate
        name: peer eval regression gate
        entry: uv run peer eval --gate
        language: system
        pass_filenames: false
        always_run: true
